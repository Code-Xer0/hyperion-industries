<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyperion Card Studio | Hyperion Industries</title>
    <meta
      name="description"
      content="Hyperion Card Studio for composing and refining operator card layouts."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #070808;
        --panel: rgba(16, 18, 19, 0.82);
        --line: rgba(255, 199, 44, 0.22);
        --line-soft: rgba(255, 255, 255, 0.11);
        --text: #f8f7ef;
        --muted: #aaa597;
        --gold: #ffc72c;
        --graphite: #111213;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.48);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(rgba(255, 199, 44, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 199, 44, 0.04) 1px, transparent 1px),
          radial-gradient(circle at 80% 12%, rgba(255, 199, 44, 0.15), transparent 36%),
          var(--bg);
        background-size: 96px 96px, 96px 96px, auto, auto;
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .studio-nav {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 74px;
        padding: 14px clamp(16px, 4vw, 64px);
        border-bottom: 1px solid var(--line-soft);
        background: rgba(7, 8, 8, 0.78);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand img {
        width: 42px;
        height: 42px;
        object-fit: contain;
        filter: drop-shadow(0 10px 24px rgba(255, 199, 44, 0.16));
      }

      .brand-word {
        display: grid;
        gap: 1px;
        text-transform: uppercase;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        line-height: 1.1;
      }

      .brand-word span:last-child {
        color: var(--muted);
        letter-spacing: 0.12em;
      }

      .studio-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .btn-primary {
        border-color: var(--gold);
        background: var(--gold);
        color: var(--graphite);
      }

      .shell {
        width: min(1520px, calc(100vw - 32px));
        margin: 0 auto;
        padding: clamp(18px, 3vw, 34px) 0 28px;
      }

      .head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 14px;
        padding: clamp(16px, 2vw, 22px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
      }

      .kicker {
        margin: 0 0 8px;
        color: var(--gold);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 4.4rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .frame {
        height: min(920px, calc(100vh - 178px));
        min-height: 620px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
        box-shadow: var(--shadow);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #050607;
      }

      @media (max-width: 720px) {
        .studio-nav {
          align-items: flex-start;
          flex-direction: column;
        }

        .studio-actions {
          width: 100%;
          justify-content: stretch;
        }

        .btn {
          flex: 1 1 150px;
        }

        .head {
          align-items: stretch;
          flex-direction: column;
        }

        .frame {
          height: calc(100vh - 250px);
          min-height: 540px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="studio-nav" aria-label="Card Studio">
      <a class="brand" href="/" aria-label="Hyperion Industries home">
        <img src="/assets/branding/hyperion/hyperion-mark-dark.svg" alt="" />
        <span class="brand-word">
          <span>Hyperion</span>
          <span>Industries</span>
        </span>
      </a>
      <div class="studio-actions">
        <a class="btn" href="/">Home</a>
        <a class="btn" href="/dxcard/">DX Card</a>
        <a class="btn btn-primary" href="/assets/card-studio/studio.html">Open Studio ↗</a>
      </div>
    </nav>

    <main class="shell">
      <header class="head">
        <div>
          <p class="kicker">Hyperion Industries</p>
          <h1>Card Studio</h1>
        </div>
        <a class="btn btn-primary" href="/assets/card-studio/studio.html" target="_blank" rel="noopener noreferrer">
          Open Fullscreen ↗
        </a>
      </header>

      <section class="frame" aria-label="Embedded Hyperion Card Studio">
        <iframe
          title="Hyperion Card Studio"
          src="/assets/card-studio/studio.html"
          loading="eager"
          referrerpolicy="same-origin"
          sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads allow-modals"
        ></iframe>
      </section>
    </main>
  </body>
</html>
