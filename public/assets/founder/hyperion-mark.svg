<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none">
  <title>Hyperion Red Mark - Transparent Background</title>
  <defs>
    <linearGradient id="redMark" x1="627" y1="124" x2="627" y2="1110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff1d1d"/>
      <stop offset="0.42" stop-color="#ff1717"/>
      <stop offset="1" stop-color="#b80c0c"/>
    </linearGradient>
    <linearGradient id="redEdge" x1="203" y1="627" x2="1050" y2="627" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c70f0f"/>
      <stop offset="0.5" stop-color="#ff1b1b"/>
      <stop offset="1" stop-color="#c70f0f"/>
    </linearGradient>
    <linearGradient id="orangeMark" x1="381" y1="626" x2="873" y2="626" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb143"/>
      <stop offset="0.55" stop-color="#ff5a18"/>
      <stop offset="1" stop-color="#ffb143"/>
    </linearGradient>
    <filter id="redGlow" x="120" y="40" width="1014" height="1170" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95  0 0.12 0 0 0  0 0 0.12 0 0  0 0 0 0.75 0"/>
    </filter>
    <filter id="orangeGlow" x="330" y="520" width="594" height="214" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 0.55 0 0 0.18  0 0 0.05 0 0  0 0 0 0.8 0"/>
    </filter>
  </defs>

  <!-- Soft red/orange glow; transparent background. -->
  <g filter="url(#redGlow)" opacity="0.7">
    <path d="M627 124 L891 433 L826 433 L627 209 L428 433 L363 433 Z" fill="#ff1717"/>
    <path d="M363 804 L429 804 L626 1029 L824 804 L890 804 L626 1110 Z" fill="#ff1717"/>
    <path d="M337 463 L430 463 L293 625 L426 774 L336 774 L203 627 Z" fill="#ff1717"/>
    <path d="M825 463 L917 463 L1051 627 L918 774 L828 774 L961 625 Z" fill="#ff1717"/>
    <path d="M556 356 L474 450 L474 782 L553 878 L556 659 L613 600 L556 597 Z" fill="#ff1717"/>
    <path d="M698 357 L779 450 L779 782 L700 879 L698 659 L640 600 L698 597 Z" fill="#ff1717"/>
  </g>
  <g filter="url(#orangeGlow)" opacity="0.85">
    <path d="M443 560 L381 628 L445 691 L393 627 Z" fill="#ff8a1c"/>
    <path d="M811 561 L873 628 L809 692 L861 627 Z" fill="#ff8a1c"/>
  </g>

  <!-- Main vector mark. -->
  <g stroke="#ff2525" stroke-width="4" stroke-linejoin="miter" stroke-miterlimit="10">
    <path d="M627 124 L891 433 L826 433 L627 209 L428 433 L363 433 Z" fill="url(#redMark)"/>
    <path d="M363 804 L429 804 L626 1029 L824 804 L890 804 L626 1110 Z" fill="url(#redMark)"/>
    <path d="M337 463 L430 463 L293 625 L426 774 L336 774 L203 627 Z" fill="url(#redEdge)"/>
    <path d="M825 463 L917 463 L1051 627 L918 774 L828 774 L961 625 Z" fill="url(#redEdge)"/>
    <path d="M556 356 L474 450 L474 782 L553 878 L556 659 L613 600 L556 597 Z" fill="url(#redMark)"/>
    <path d="M698 357 L779 450 L779 782 L700 879 L698 659 L640 600 L698 597 Z" fill="url(#redMark)"/>
  </g>

  <!-- Orange inner chevrons. -->
  <g stroke="#ffb84a" stroke-width="2" stroke-linejoin="miter" stroke-miterlimit="10">
    <path d="M443 560 L381 628 L445 691 L393 627 Z" fill="url(#orangeMark)"/>
    <path d="M811 561 L873 628 L809 692 L861 627 Z" fill="url(#orangeMark)"/>
  </g>
</svg>
