name: Governed site-builder artifact

on:
  push:
    branches:
      - "builder/**"
      - "codex/site-builder-runtime"
  pull_request:
    paths:
      - "site-content/**"
      - "contracts/site-builder/**"
      - "src/components/content/**"
      - "src/generated/siteContent.js"
      - "src/pages/ContentPage.jsx"
      - "scripts/compile-site-content.mjs"

permissions:
  contents: read

concurrency:
  group: site-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix workers/operator
      - run: npm ci --prefix workers/public-mcp
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: governed-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
