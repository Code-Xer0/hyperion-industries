name: MCP Soft-Launch Monitor

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperion-public-mcp-soft-launch
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe MCP failure boundary
        env:
          HYPERION_MCP_ENDPOINT: https://hyperion-public-mcp.hyperion-industries-intake.workers.dev/mcp
        run: node scripts/smoke-public-mcp.mjs
