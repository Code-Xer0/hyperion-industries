# Production binding for the Hyperion public intake Worker.
name = "hyperion-operator"
main = "src/index.ts"
compatibility_date = "2026-07-13"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "hyperion-industries.dev/api/operator/*", zone_name = "hyperion-industries.dev" },
  { pattern = "hyperion-industries.dev/api/intake/*", zone_name = "hyperion-industries.dev" },
  { pattern = "hyperion-industries.dev/api/card-studio/*", zone_name = "hyperion-industries.dev" },
]

[vars]
SITE_ORIGIN = "https://hyperion-industries.dev"
OPENROUTER_MODEL = "openai/gpt-5.2"
INQUIRY_NOTIFY_TO = "hello@hyperion-industries.dev"
INQUIRY_FROM_EMAIL = "operator@hyperion-industries.dev"
INQUIRY_CONSENT_VERSION = "2026-07-13"
INTAKE_RESUME_FROM = "signal@intake.hyperion-industries.dev"
INTAKE_ACKNOWLEDGEMENT_FROM = "signal@intake.hyperion-industries.dev"
INTAKE_COOKIE_NAME = "hyperion_resume"
FOUNDER_COMMAND_PULL_KEY_ID = "fc-intake-v1"
CARD_STUDIO_INVITE_REQUIRED = "true"

[[d1_databases]]
binding = "DB"
database_name = "hyperion-operator"
database_id = "d6e34723-f12f-4570-8de7-90891052c600"
migrations_dir = "migrations"

[[send_email]]
name = "INQUIRY_EMAIL"
destination_address = "hello@hyperion-industries.dev"
allowed_sender_addresses = ["operator@hyperion-industries.dev"]

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "41001"

  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "INQUIRY_RATE_LIMITER"
namespace_id = "41002"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "INTAKE_RESUME_RATE_LIMITER"
namespace_id = "41003"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "INTAKE_SUBMISSION_RATE_LIMITER"
namespace_id = "41004"

  [ratelimits.simple]
  limit = 8
  period = 60

[[ratelimits]]
name = "INTAKE_OPERATOR_RATE_LIMITER"
namespace_id = "41005"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "CARD_STUDIO_RATE_LIMITER"
namespace_id = "41006"

  [ratelimits.simple]
  limit = 30
  period = 60

# Bind CARD_STUDIO_ASSETS to the private quarantine R2 bucket and
# CARD_STUDIO_UPLOAD_SCANNER to the scanning broker before enabling uploads.
# The Worker intentionally fails closed when either binding is unavailable.

# Production retention schedule: `17 4 * * *`.
# The schedule is managed as a separate Cloudflare trigger so a trigger-permission
# failure cannot roll back the API route deployment.

# Add OPENROUTER_API_KEY with `wrangler secret put OPENROUTER_API_KEY`.
# Add RESEND_API_KEY with `wrangler secret put RESEND_API_KEY`; never place it in this file.
# Add RESEND_WEBHOOK_SIGNING_SECRET with `wrangler secret put RESEND_WEBHOOK_SIGNING_SECRET`.
# Add FOUNDER_COMMAND_PULL_TOKEN_SHA256 with `wrangler secret put FOUNDER_COMMAND_PULL_TOKEN_SHA256`.
# Add CARD_STUDIO_SHOPIFY_STOREFRONT_TOKEN with `wrangler secret put CARD_STUDIO_SHOPIFY_STOREFRONT_TOKEN`.
# Add CARD_STUDIO_SHOPIFY_WEBHOOK_SECRET with `wrangler secret put CARD_STUDIO_SHOPIFY_WEBHOOK_SECRET`.
# Configure CARD_STUDIO_SHOPIFY_STORE_DOMAIN, a pinned Storefront API version,
# and CARD_STUDIO_SHOPIFY_VARIANTS only after catalog mappings are reviewed.
# During rotation, add FOUNDER_COMMAND_PULL_PREVIOUS_TOKEN_SHA256 as a secret and set
# FOUNDER_COMMAND_PULL_PREVIOUS_UNTIL to a bounded ISO-8601 overlap deadline.
# Public browser traffic remains same-origin through the two production routes.
