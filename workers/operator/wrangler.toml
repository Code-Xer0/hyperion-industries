# Deployment template: replace the zero D1 ID and review routes before use.
name = "hyperion-operator"
main = "src/index.ts"
compatibility_date = "2026-07-13"
workers_dev = false

[vars]
SITE_ORIGIN = "https://hyperion-industries.dev"
OPENROUTER_MODEL = "openai/gpt-5.2"
INQUIRY_NOTIFY_TO = "hello@hyperion-industries.dev"
INQUIRY_FROM_EMAIL = "operator@hyperion-industries.dev"
INQUIRY_CONSENT_VERSION = "2026-07-13"
INTAKE_RESUME_FROM = "signal@intake.hyperion-industries.dev"
INTAKE_COOKIE_NAME = "hyperion_resume"

[[d1_databases]]
binding = "DB"
database_name = "hyperion-operator"
database_id = "00000000-0000-0000-0000-000000000000" # Replace before deployment.
migrations_dir = "migrations"

[[send_email]]
name = "INQUIRY_EMAIL"
destination_address = "hello@hyperion-industries.dev"
allowed_sender_addresses = ["operator@hyperion-industries.dev"]

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "41001"

  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "INQUIRY_RATE_LIMITER"
namespace_id = "41002"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "INTAKE_RESUME_RATE_LIMITER"
namespace_id = "41003"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "INTAKE_SUBMISSION_RATE_LIMITER"
namespace_id = "41004"

  [ratelimits.simple]
  limit = 8
  period = 60

[triggers]
crons = ["17 4 * * *"]

# Add OPENROUTER_API_KEY with `wrangler secret put OPENROUTER_API_KEY`.
# Add RESEND_API_KEY with `wrangler secret put RESEND_API_KEY`; never place it in this file.
# Route this Worker on the same origin as SITE_ORIGIN, for example:
# routes = [{ pattern = "hyperion-industries.dev/api/operator/*", zone_name = "hyperion-industries.dev" }]
